const STIMULI = [{"id": "r01", "orig": "The migration, which had passed every staging run against a 40 GB snapshot seeded with synthetic rows, died forty minutes into production because the real orders table held 1.2 billion rows and a decade of drift. An ALTER TABLE adding a NOT NULL column with a default forced PostgreSQL 10 to rewrite the entire heap, and that rewrite queued behind long-running checkout transactions, then demanded an ACCESS EXCLUSIVE lock every subsequent write had to wait out. Connection pool exhaustion alerts paged on-call within ninety seconds as requests piled into a traffic jam with no exit ramp. Engineers assumed the default was metadata-only, a fast path PostgreSQL 11 introduced, not 10. The rollback runbook, never rehearsed, cost another twenty minutes. Staging had lied by omission. Teams now shadow-migrate against full-size clones, timebox DDL with lock_timeout at 5 seconds, and backfill in batches before tightening constraints, a discipline some call \"expand, then squeeze.\"", "placebo": "The migration passed every staging run, which used a 40 GB snapshot seeded with synthetic rows. Forty minutes into production, it failed, because the real orders table held 1.2 billion rows and a decade of drift. The ALTER TABLE added a NOT NULL column with a default. On PostgreSQL 10, that forced a rewrite of the entire heap. The rewrite first waited behind long-running checkout transactions, then demanded an ACCESS EXCLUSIVE lock, and every later write had to wait for it. Within ninety seconds, connection pool exhaustion alerts paged on-call, as requests piled up with no way out. Engineers had assumed the default was metadata-only, but that fast path arrived in PostgreSQL 11, not 10. The rollback runbook had never been rehearsed, and it cost another twenty minutes. Staging had misled them by omission. Teams now shadow-migrate against full-size clones, limit DDL with a 5-second lock_timeout, and backfill in batches before tightening constraints. Some call this \"expand, then squeeze.\"", "skill": "The migration passed every staging run against a 40 GB snapshot of synthetic rows, yet died forty minutes into production. The real orders table held 1.2 billion rows and a decade of drift. The ALTER TABLE added a NOT NULL column with a default, which on PostgreSQL 10 forces a rewrite of the entire heap. That rewrite queued behind long-running checkout transactions, then requested an ACCESS EXCLUSIVE lock that every later write had to wait out. Connection pool exhaustion alerts paged on-call within ninety seconds as requests piled up. Engineers assumed the default was metadata-only, but that fast path arrived in PostgreSQL 11, not 10. The rollback runbook, never rehearsed, cost another twenty minutes. Staging had lied by omission. Teams now shadow-migrate against full-size clones, set lock_timeout to 5 seconds, and backfill in batches before tightening constraints. Some call this discipline \"expand, then squeeze.\"", "questions": [{"q": "How many rows did the production orders table hold?", "correct": "1.2 billion rows", "wrong": "40 million rows"}, {"q": "Which PostgreSQL version introduced metadata-only defaults?", "correct": "PostgreSQL 11", "wrong": "PostgreSQL 10"}]}, {"id": "r02", "orig": "This retry loop hammers the payment gateway the way a toddler hammers an elevator button. Five attempts at a fixed 200 ms interval means a 2-second outage burns the whole budget before the upstream even recovers, and every client, synchronized by the same deploy, stampedes back in lockstep: a thundering-herd-on-a-timer. Swap in exponential backoff with full jitter (base 100 ms, cap 10 s, per the AWS architecture guidance) and wrap the call in a circuit breaker. The catch block, which currently swallows every exception including 400-series validation errors, should retry only on 429, 503, and connection resets; a malformed request will fail identically on attempt five. Also, the idempotency key header retry logic needs a test: I suspect duplicate charges slip through when the first POST times out but succeeds server-side. Please ticket the metrics gap too.", "placebo": "This retry loop hammers the payment gateway the way a toddler hammers an elevator button. Five attempts at a fixed 200 ms interval mean a 2-second outage burns the whole budget before the upstream recovers. Every client, synchronized by the same deploy, stampedes back in lockstep, a thundering herd on a timer. Switch to exponential backoff with full jitter (base 100 ms, cap 10 s, per the AWS architecture guidance) and wrap the call in a circuit breaker. The catch block swallows every exception, including 400-series validation errors. It should retry only on 429, 503, and connection resets, because a malformed request fails identically on attempt five. Please also test the idempotency key header retry logic, since I suspect duplicate charges slip through when the first POST times out but succeeds server-side. Please ticket the metrics gap too.", "skill": "This retry loop pounds the payment gateway like a toddler pressing an elevator button. It makes five attempts at a fixed 200 ms interval, so a 2-second outage uses up every attempt before the upstream recovers. Because one deploy synchronized every client, they retry together and flood the gateway, a thundering herd on a timer. Please switch to exponential backoff with full jitter (base 100 ms, cap 10 s, per the AWS architecture guidance) and wrap the call in a circuit breaker. The catch block currently swallows every exception, including 400-series validation errors. It should retry only on 429, 503, and connection resets, because a malformed request will fail the same way on attempt five. The idempotency key header retry logic needs a test; I suspect duplicate charges slip through when the first POST times out but succeeds server-side. Please open a ticket for the metrics gap.", "questions": [{"q": "How many retry attempts does the current loop make?", "correct": "Five", "wrong": "Three"}, {"q": "What base delay is proposed for exponential backoff?", "correct": "100 ms", "wrong": "200 ms"}]}, {"id": "r03", "orig": "The 2022 UK pilot, which ran across 61 companies and roughly 2,900 employees for six months, found 56 firms kept the shorter schedule, and revenue barely flinched. Such numbers flatter the idea but hide their selection bias: volunteers self-sort toward knowledge-work shops whose meeting-heavy calendars carry obvious fat. Iceland's 2015–2019 public-sector trials, covering about 2,500 workers, suggest the dividend comes less from fewer hours than from a forced calendar audit, the \"Friday tax\" leaders finally refuse to pay. Teams should pilot it where output, not presence, defines value; customer support rotations and on-call incident response coverage plans rarely survive compression without extra headcount. The test: if a team cannot meeting-diet its way to 32 hours within one quarter, the four-day week becomes a pay cut wearing a perk's clothes.", "placebo": "In the 2022 UK pilot, 61 companies and about 2,900 employees tried a shorter schedule for six months. Afterward, 56 firms kept it, and revenue barely changed. These numbers make the idea look better than it may be, because the firms volunteered. Volunteers tend to be knowledge-work companies, and their calendars are full of meetings that are easy to cut. Iceland's public-sector trials, which ran from 2015 to 2019 and covered about 2,500 workers, suggest a different source of the gain. The benefit seems to come less from fewer hours than from a forced review of the calendar, which ends the \"Friday tax\" that leaders have never been willing to stop paying. Teams should pilot the shorter week where output, not presence, defines value. Customer support rotations and on-call incident response plans rarely survive compression without extra staff. Here is the test: if a team cannot cut meetings enough to reach 32 hours within one quarter, the four-day week becomes a pay cut disguised as a perk.", "skill": "In 2022, a UK pilot ran for six months across 61 companies and roughly 2,900 employees. Of these, 56 kept the shorter schedule, and revenue barely changed. These numbers flatter the idea because the volunteers were not a random sample. Volunteers favored knowledge-work firms with meeting-heavy calendars and obvious waste to cut. Iceland's public-sector trials from 2015 to 2019, which covered about 2,500 workers, suggest the benefit comes less from fewer hours than from being forced to audit the calendar, which ends the \"Friday tax\" that leaders finally refuse to pay. Teams should pilot a shorter week where output, not presence, defines value. Customer support rotations and on-call incident response coverage plans rarely survive compression without extra headcount. The test: if a team cannot cut meetings to reach 32 hours within one quarter, the four-day week becomes a disguised pay cut.", "questions": [{"q": "How many companies took part in the 2022 UK pilot?", "correct": "61 companies", "wrong": "56 companies"}, {"q": "About how many workers did Iceland's public-sector trials cover?", "correct": "About 2,500 workers", "wrong": "About 2,900 workers"}]}, {"id": "r04", "orig": "A vaccine rehearses infection without the plot's lethal ending. Antigen fragments, whether from inactivated virions, purified protein subunits or mRNA translated inside deltoid muscle cells, drain to lymph nodes, where dendritic cells chaperone the cargo and display peptides on MHC molecules. Helper T cells, selected from billions of randomly generated receptor variants by their matching epitope, license B cells to proliferate inside germinal centers: antibody boot camps where somatic hypermutation sharpens binding affinity over two to four weeks. Most effector cells then die; long-lived plasma cells and memory lymphocyte reserves persist for years, sometimes decades. Immunologists know the payoff comes later: on genuine exposure, a secondary response mounts within days rather than the primary week-plus lag, often neutralizing the pathogen before symptoms surface. Aluminum-salt adjuvants, used since the 1930s, amplify the alarm signal. Boosters re-quiz the class, and immunity hardens.", "placebo": "A vaccine lets the body practice fighting an infection without the deadly outcome. It delivers fragments of the germ, called antigens. These can come from inactivated virions, purified protein subunits, or mRNA that is translated inside deltoid muscle cells. The fragments drain to lymph nodes, where dendritic cells carry them and display peptides on MHC molecules. Helper T cells, chosen for their matching epitope from billions of randomly generated receptor variants, then license B cells to multiply inside germinal centers. There, over two to four weeks, somatic hypermutation sharpens how tightly antibodies bind. Most effector cells then die, but long-lived plasma cells and memory lymphocytes persist for years, sometimes decades. On real exposure, a secondary response starts within days, not the primary response's lag of over a week, and often stops the pathogen before symptoms appear. Aluminum-salt adjuvants, used since the 1930s, strengthen the alarm signal. Boosters repeat the lesson, and immunity grows stronger.", "skill": "A vaccine lets the body practice fighting an infection without the deadly outcome. It delivers fragments of the pathogen, called antigens, which can come from inactivated virus particles, purified protein pieces, or mRNA that muscle cells in the shoulder turn into protein. These fragments travel to lymph nodes, where dendritic cells pick them up and show peptides on MHC molecules. Helper T cells, chosen from billions of randomly generated receptor variants because they match the epitope, signal B cells to multiply inside germinal centers. There, over two to four weeks, antibody-producing cells mutate and improve how tightly they bind. Most effector cells then die, but long-lived plasma cells and memory lymphocytes last for years, sometimes decades. Immunologists know the benefit comes later. When the real pathogen arrives, the secondary response starts within days, not the week or more of the first response, and often stops the pathogen before symptoms appear. Aluminum-salt adjuvants, used since the 1930s, strengthen the alarm signal. Boosters repeat the lesson, and immunity strengthens.", "questions": [{"q": "How long does somatic hypermutation sharpen binding affinity?", "correct": "Two to four weeks", "wrong": "Several months to a year"}, {"q": "Since when have aluminum-salt adjuvants been used?", "correct": "Since the 1930s", "wrong": "Since the 1960s"}]}, {"id": "r05", "orig": "Most new graduates assume the first offer is final, but it rarely is. Recruiters typically budget 5–10% of headroom above the opening figure, and the number spoken first anchors everything after it, so let the employer name theirs. Salary band data from Levels.fyi, Glassdoor, or the BLS Occupational Outlook should script your counter, ideally landing near the band's 75th percentile. Candidates who accept the opening offer without a single counter pay a silence tax: a $5,000 shortfall, compounded by 3% annual raises, swells past $370,000 over a 40-year career. Babcock's Carnegie Mellon research found only 7% of women negotiated versus 57% of men, a gap the offer letter quietly launders into lifetime earnings. Email your counter, cite market evidence rather than personal need, and treat signing bonuses, equity, and start dates as spare currency when base pay stalls.", "placebo": "Most new graduates assume the first offer is final, but it rarely is. Recruiters typically budget 5–10% of headroom above the opening figure, and the first number spoken tends to anchor everything after it, so let the employer name theirs first. Use salary band data from Levels.fyi, Glassdoor, or the BLS Occupational Outlook to plan your counter, ideally landing near the band's 75th percentile. Candidates who accept the opening offer without a single counter pay a silence tax. A $5,000 shortfall, compounded by 3% annual raises, grows to more than $370,000 over a 40-year career. Babcock's Carnegie Mellon research found that only 7% of women negotiated, compared with 57% of men, and the offer letter quietly turns that gap into lifetime earnings differences. Send your counter by email and cite market evidence rather than personal need. If base pay stalls, treat signing bonuses, equity, and start dates as extra currency you can trade.", "skill": "Most new graduates assume the first offer is final, but it rarely is. Recruiters typically leave 5–10% of room above the opening figure. The first number spoken also sets the reference point for everything after it, so let the employer name theirs first. Use salary band data from Levels.fyi, Glassdoor, or the BLS Occupational Outlook to plan your counteroffer, ideally aiming near the band's 75th percentile. Candidates who accept the opening offer without countering lose money: a $5,000 shortfall, with 3% annual raises, grows to more than $370,000 over a 40-year career. Babcock's research at Carnegie Mellon found that only 7% of women negotiated, compared with 57% of men, and the offer letter turns that gap into lower lifetime earnings without anyone noticing. Email your counter and cite market evidence rather than personal need. If base pay stalls, negotiate signing bonuses, equity, and start dates instead.", "questions": [{"q": "How much headroom do recruiters typically budget above the opening offer?", "correct": "5–10%", "wrong": "15–20%"}, {"q": "In Babcock's research, what percentage of women negotiated?", "correct": "7%", "wrong": "57%"}]}, {"id": "r06", "orig": "At 02:14 UTC, a single NTP-orphaned host in the eu-west payment gateway pool drifted 4.7 seconds ahead, and its token signer began minting authorization tokens the downstream fraud-check service judged expired on arrival. Retries amplified the damage: clients exponential-backoffed into a thundering herd, and card authorization queue depth climbed past 180,000 within eleven minutes. The on-call engineer, paged twice by alerts that described symptoms rather than causes, assumed the fraud service was the culprit and rolled it back, which bought nothing. Roughly 38 minutes of degraded checkout, about 2.1% of daily transaction volume, passed before someone grepped the logs for skew. Root cause was time debt: chrony had silently died after a kernel patch, and no health check watched clock offset. Remediation: alert at 500 ms drift, allow 2 s leeway in token validation, and quarantine any host the time fleet disowns.", "placebo": "At 02:14 UTC, one host in the eu-west payment gateway pool lost its time sync and drifted 4.7 seconds ahead. Its token signer then issued authorization tokens that the downstream fraud-check service rejected as expired on arrival. Retries made things worse. Clients backed off exponentially but still arrived in a thundering herd, and the card authorization queue grew past 180,000 within eleven minutes. The on-call engineer was paged twice, but the alerts described symptoms rather than causes. Assuming the fraud service was at fault, the engineer rolled it back, which changed nothing. Checkout was degraded for roughly 38 minutes, affecting about 2.1% of daily transaction volume, before someone searched the logs for clock skew. The root cause was time debt: chrony had silently died after a kernel patch, and no health check watched clock offset. The fixes are an alert at 500 ms drift, 2 s of leeway in token validation, and quarantine for any host the time fleet disowns.", "skill": "At 02:14 UTC, one host in the eu-west payment gateway pool lost its NTP sync and drifted 4.7 seconds ahead. Its token signer then issued authorization tokens that the downstream fraud-check service rejected as expired the moment they arrived. Retries made things worse. Clients backed off exponentially but still arrived in a thundering herd, and the card authorization queue grew past 180,000 within eleven minutes. The on-call engineer was paged twice, but the alerts described symptoms, not causes. The engineer assumed the fraud service was at fault and rolled it back, which changed nothing. Checkout was degraded for roughly 38 minutes, affecting about 2.1% of daily transaction volume, before someone searched the logs for clock skew. The root cause was neglected timekeeping: chrony had silently died after a kernel patch, and no health check watched clock offset. The fixes are an alert at 500 ms drift, 2 s of leeway in token validation, and quarantine for any host the time fleet disowns.", "questions": [{"q": "How far ahead did the orphaned host's clock drift?", "correct": "4.7 seconds", "wrong": "2.1 seconds"}, {"q": "What did the on-call engineer roll back?", "correct": "The fraud-check service", "wrong": "The kernel patch"}]}, {"id": "r07", "orig": "A rate rise reprices every house without touching a single brick. When the Federal Reserve lifted its policy rate from near zero to 5.25–5.5% between March 2022 and July 2023, the average 30-year fixed mortgage, which tracks ten-year Treasury yields more closely than Fed announcements, climbed from roughly 3% to above 7%. On a $400,000 loan, that move inflates the monthly payment from about $1,686 to $2,661, so buyers discovered their borrowing power had shrunk by more than a third. Mortgage affordability calculations simply refuse the old prices. Meanwhile, owners sitting on sub-4% loans stay put, a golden-handcuffs lock-in that starves listing inventory. Transactions freeze before prices fall: US existing-home sales sank to 4.09 million in 2023, the lowest since 1995. Credit is the market's oxygen; higher rates ration it, and demand gasps accordingly.", "placebo": "A rate rise changes the price of every house without touching a single brick. The Federal Reserve raised its policy rate from near zero to 5.25–5.5% between March 2022 and July 2023. The average 30-year fixed mortgage rate follows ten-year Treasury yields more closely than it follows Fed announcements, and it climbed from roughly 3% to above 7%. On a $400,000 loan, the monthly payment rose from about $1,686 to $2,661, so buyers found their borrowing power had shrunk by more than a third. Under these new calculations, the old prices no longer worked. Meanwhile, owners with loans below 4% stayed where they were, a \"golden handcuffs\" lock-in that left few homes for sale. Sales froze before prices fell. US existing-home sales dropped to 4.09 million in 2023, the lowest since 1995. Credit is the market's oxygen, and higher rates ration it, so demand gasps.", "skill": "A rate rise changes what every house is worth, even though the house itself stays the same. Between March 2022 and July 2023, the Federal Reserve raised its policy rate from near zero to 5.25–5.5%. The average 30-year fixed mortgage rate follows ten-year Treasury yields more closely than it follows Fed announcements, and it climbed from roughly 3% to above 7%. On a $400,000 loan, the monthly payment went from about $1,686 to $2,661, so buyers found that their borrowing power had shrunk by more than a third. At those payments, the old prices no longer pass affordability calculations. Owners with loans below 4% stayed put rather than give up those cheap loans, so fewer homes were listed. Sales stall before prices fall: US existing-home sales dropped to 4.09 million in 2023, the lowest since 1995. Credit keeps the housing market going, and higher rates ration it, so demand falls.", "questions": [{"q": "What does the 30-year mortgage rate track most closely?", "correct": "Ten-year Treasury yields", "wrong": "Federal Reserve announcements"}, {"q": "What was the monthly payment on $400,000 after rates rose?", "correct": "About $2,661", "wrong": "About $1,686"}]}, {"id": "r08", "orig": "Sleep loss starves memory at both ends of its pipeline. One sleepless night, Matthew Walker's group found, cuts hippocampal encoding capacity by roughly 40%, the hippocampus refusing new input like an inbox nobody has emptied. The deeper damage happens offline: slow-wave sleep, with its 0.5–1 Hz oscillations nested alongside 11–16 Hz spindles and hippocampal sharp-wave ripples, replays the day's traces and ships them neocortex-ward for long-term storage. Skip that night shift, and consolidation stalls. Researchers suspect the brain's glymphatic waste clearance system, whose interstitial channels widen by about 60% during sleep in mice, also falls behind, leaving metabolic debris such as amyloid-beta to fog the next day's learning. Even partial restriction compounds: subjects held to six hours for two weeks performed attention tests like the totally sleep-deprived, yet rated themselves only mildly impaired. Memory, in short, is built by day but banked by night.", "placebo": "Sleep loss harms memory at both ends of the process. In Matthew Walker's group, one sleepless night cut the hippocampus's ability to encode new information by roughly 40%, as if its inbox were full and could take no more. The deeper damage happens while we sleep. During slow-wave sleep, 0.5–1 Hz oscillations occur alongside 11–16 Hz spindles and hippocampal sharp-wave ripples. Together they replay the day's memory traces and send them to the neocortex for long-term storage. Without that night shift, consolidation stalls. Researchers also suspect that the brain's glymphatic system, which clears waste, falls behind. In mice, its interstitial channels widen by about 60% during sleep. Without that clearing, metabolic debris such as amyloid-beta may cloud the next day's learning. Even partial restriction adds up. Subjects limited to six hours for two weeks did as poorly on attention tests as people who were fully sleep-deprived, yet they rated themselves as only mildly impaired. In short, memory is built by day but banked by night.", "skill": "Sleep loss harms memory at both ends of its pipeline. Matthew Walker's group found that one sleepless night cuts the hippocampus's capacity to encode new information by roughly 40%, much like an inbox nobody has emptied that can't take new mail. The deeper damage happens offline. During slow-wave sleep, 0.5–1 Hz oscillations occur alongside 11–16 Hz spindles and hippocampal sharp-wave ripples. Together they replay the day's memory traces and send them to the neocortex for long-term storage. If you skip that night shift, consolidation stalls. Researchers suspect the brain's glymphatic system, which clears waste, also falls behind. In mice, its interstitial channels widen by about 60% during sleep. Without that clearing, metabolic debris such as amyloid-beta may cloud the next day's learning. Even partial restriction adds up: subjects held to six hours of sleep for two weeks did as poorly on attention tests as people who were totally sleep-deprived, yet they rated themselves as only mildly impaired. In short, memory is built by day but stored at night.", "questions": [{"q": "By roughly how much does one sleepless night cut hippocampal encoding capacity?", "correct": "About 40%", "wrong": "About 60%"}, {"q": "In mice, what widens by about 60% during sleep?", "correct": "Glymphatic interstitial channels", "wrong": "Hippocampal sharp-wave ripples"}]}, {"id": "r09", "orig": "Your deck buries the lede on slide nine, where the 40% month-over-month revenue growth finally surfaces beneath three slides of market-sizing boilerplate. Investors skimming a seed pitch decide within the first 3 minutes, often under 4 for the whole deck per DocSend's averages, so the traction metric, the one number your entire fundraising argument depends on, arrives after attention has already left the room. Your opening slide headlines a mission statement; the data wants a seat at the front. Front-load it: slide two should lead with growth, then the customer acquisition cost payback period of 5 months, then the problem. The current structure is a slow-reveal mystery novel where the reader skips to the last chapter or quits. Investors will assume the hiding was deliberate. Cut the TAM preamble to one line and let traction do the talking.", "placebo": "Your deck hides its most important number. The 40% month-over-month revenue growth only appears on slide nine, after three slides of market-sizing boilerplate. Investors decide quickly on a seed pitch. According to DocSend's averages, they often spend under 4 minutes on the whole deck, and they form a view within the first 3 minutes. That means your traction metric, the one number your fundraising argument depends on, shows up after their attention has gone. Your opening slide also leads with a mission statement when the data should come first. Move growth to slide two, then give the customer acquisition cost payback period of 5 months, then explain the problem. Right now the deck reads like a slow mystery novel, and readers skip to the end or quit. Investors may also assume the delay was deliberate. Cut the market-sizing preamble to one line and let traction speak.", "skill": "Your deck hides its best news. The 40% month-over-month revenue growth doesn't appear until slide nine, after three slides of generic market-sizing material. Investors reviewing a seed pitch decide within the first 3 minutes, and DocSend's averages show they often spend under 4 minutes on the whole deck. So the one number your fundraising case depends on shows up after they have stopped paying attention. Your opening slide is a mission statement, but the data should go up front. Make slide two lead with growth, then the customer acquisition cost payback period of 5 months, then the problem. As it stands, readers have to wait for the payoff, and they will either skip ahead to the end or quit. Investors may also assume you hid the numbers on purpose. Cut the market-size introduction to one line and let your traction speak for itself.", "questions": [{"q": "On which slide does the revenue growth figure appear?", "correct": "Slide nine", "wrong": "Slide two"}, {"q": "What month-over-month revenue growth does the deck report?", "correct": "40%", "wrong": "5%"}]}, {"id": "r10", "orig": "Every recursive resolver hoards answers. Each record carries a TTL, a 32-bit seconds counter from RFC 1035, licensing reuse without re-asking the authoritative server. Change an A record at noon with a 3600-second TTL, and a resolver queried at 11:59 keeps vouching for the old IP until nearly 1 p.m.; clients assume the address is current because nothing flags it otherwise. The resolver cache expiry window, not the edit, governs propagation. Worse, a resolver that cached NXDOMAIN before your brand-new subdomain existed will, under RFC 2308 negative caching, keep denying it until the SOA minimum lapses. Browsers and OS stub resolvers layer private caches on top, some ignoring TTLs outright. Call it TTL debt: operators must bookend migrations, dropping TTLs to 300 seconds one full old-TTL period beforehand, or the internet keeps navigating by a fossil map.", "placebo": "Every recursive resolver keeps copies of the answers it receives. Each record has a TTL, a 32-bit counter of seconds defined in RFC 1035, which lets the resolver reuse the answer without asking the authoritative server again. Suppose you change an A record at noon and its TTL is 3600 seconds. A resolver that was queried at 11:59 will keep giving out the old IP until almost 1 p.m., and clients will trust it because nothing marks it as stale. So the cache expiry window, not your edit, decides how fast the change spreads. Negative answers are cached too. Under RFC 2308, a resolver that cached NXDOMAIN before your new subdomain existed will keep denying it until the SOA minimum runs out. Browsers and OS stub resolvers add their own caches, and some ignore TTLs entirely. This is TTL debt. Operators should drop TTLs to 300 seconds one full old-TTL period before a migration, or the internet will keep following an outdated map.", "skill": "Every recursive resolver keeps copies of the answers it receives. Each record carries a TTL, a 32-bit counter of seconds defined in RFC 1035, which lets the resolver reuse the answer without asking the authoritative server again. Suppose you change an A record at noon and its TTL is 3600 seconds. A resolver that queried it at 11:59 will keep handing out the old IP address until nearly 1 p.m., and clients will assume that address is current because nothing tells them otherwise. So the cache expiry window on the resolver, not your edit, determines how fast the change spreads. Negative answers are cached too. Under RFC 2308, a resolver that cached NXDOMAIN before your new subdomain existed will keep saying it doesn't exist until the SOA minimum runs out. Browsers and OS stub resolvers add their own caches, and some ignore TTLs entirely. I call this TTL debt. Operators should lower TTLs to 300 seconds one full old-TTL period before a migration, or the internet will keep navigating by an outdated map.", "questions": [{"q": "Which RFC defines the 32-bit TTL seconds counter?", "correct": "RFC 1035", "wrong": "RFC 2308"}, {"q": "What lowered TTL value does the passage recommend before migrations?", "correct": "300 seconds", "wrong": "3600 seconds"}]}, {"id": "r11", "orig": "Friction between your two strongest engineers, left unaddressed through another quarter of quiet standoffs, will tax the whole team: Google's Project Aristotle, studying 180 teams, found psychological safety mattered more than who was on the team. Don't referee personalities; referee interfaces. Most senior-engineer feuds are design-authority disputes wearing a grudge costume, so a clear ownership boundary document naming who decides what usually drains much of the heat. Meet each separately first; you'll likely find each believes the other is slowing delivery. Then calendar a joint session with a written agenda and one shared, measurable deliverable. Tuckman's 1965 model calls this stage stor 's 1965 model calls this storming; teams that skip it rarely reach performing. Watch code review comment threads, because tone shows there before people resign. If one threatens to leave, replacing a senior engineer often costs six to nine months of salary. Mediate early, not after someone has gone.", "questions": [{"q": "How many teams did Google's Project Aristotle study?", "correct": "180 teams", "wrong": "150 teams"}, {"q": "What year was Tuckman's model published?", "correct": "1965", "wrong": "1975"}]}, {"id": "r12", "orig": "The pace plan assumes the body is a fixed engine, but the body has a fuel tank. Muscle and liver glycogen stores, roughly 400 to 500 grams in a trained runner, cover about 2,000 calories. Marathon pace burns close to 100 calories per mile, so the reserve runs dry somewhere near mile 20. Past that point, fat oxidation must carry the load, and it delivers ATP more slowly. The runner who banked early seconds on a cool, flat first half finds the account overdrawn. Splits that looked sustainable at mile 12 now ask for power the fuel system cannot release. Heat, dehydration losing two percent of body mass, and eccentric quad damage compound the deficit. Then the wall arrives. Prevention means negative-split discipline, 60 to 90 grams of carbohydrate per hour, and long runs that teach fat-burning before race day.", "placebo": "A pace plan treats the body like an engine that never changes, but the body actually runs on a fuel tank. A trained runner stores roughly 400 to 500 grams of glycogen in the muscles and liver, which covers about 2,000 calories. Marathon pace burns close to 100 calories per mile, so that reserve runs out near mile 20. After that, the body must rely on fat, which delivers ATP more slowly. A runner who banked a few early seconds on a cool, flat first half now finds the account overdrawn. Splits that felt sustainable at mile 12 demand power the fuel system can no longer release. Heat, dehydration that costs two percent of body /* ============================================== */
const COND = ["orig", "placebo", "skill"];
const q = new URLSearchParams(location.search);
const PID = q.get("PROLIFIC_PID") || q.get("pid") || "anon-" + Math.random().toString(36).slice(2, 8);
const SEED = parseInt(q.get("lat") ?? Math.floor(Math.random() * 3), 10) % 3;   // latin-square offset (0,1,2)
const app = document.getElementById("app");
const log = { pid: PID, lat: SEED, started: new Date().toISOString(), ua: navigator.userAgent, trials: [] };
const rnd = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const html = (s) => { app.innerHTML = s; window.scrollTo(0, 0); };
const touch = matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches;

function consent() {
  if (touch) return html("<h1>Keyboard needed</h1><p>This study needs a computer keyboard (the space bar). Please return to Prolific and open it on a laptop or desktop.</p>");
  html(`<h1>Reading study</h1><p>${CONFIG.consentText}</p><p><button id="go">I agree, continue</button></p>`);
  document.getElementById("go").onclick = instructions;
}
function instructions() {
  html(`<h1>How it works</h1>
  <p>A paragraph appears as dashes. Press the <b>space bar</b> to reveal one word at a time. Each press shows the next word and hides the previous one.</p>
  <p>Read at a natural pace, as you would read normally, and make sure you understand. After each paragraph you will answer a short question about it.</p>
  <p>First, a short practice paragraph.</p><p><button id="go">Start practice</button></p>`);
  document.getElementById("go").onclick = () => runTrial({ id: "practice", cond: "practice", text: "The village library opened in 1954 with about two hundred books. Volunteers carried them in by hand over a single weekend, and the first reader borrowed a book about bees.", questions: [{ q: "What was the first book about?", correct: "Bees", wrong: "Boats" }] }, 0, true, practiceDone);
}
function practiceDone() {
  html(`<h1>Ready?</h1><p>The real study has ${STIMULI.length} paragraphs. You can take a short break between them.</p><p><button id="go">Begin</button></p>`);
  document.getElementById("go").onclick = () => runAll(0);
}
const plan = () => rnd(STIMULI.map((s, i) => ({ id: s.id, cond: COND[(i + SEED) % 3], text: s[COND[(i + SEED) % 3]], questions: s.questions })));
let PLAN = null;
function runAll(i) {
  PLAN = PLAN || plan();
  if (i >= PLAN.length) return finish();
  runTrial(PLAN[i], i, false, () => {
    html(`<p>Paragraph ${i + 1} of ${PLAN.length} done.</p><p><button id="go">Next paragraph</button></p>`);
    document.getElementById("go").onclick = () => runAll(i + 1);
  });
}
function runTrial(item, idx, practice, done) {
  const words = item.text.split(/\s+/);
  const spans = words.map((w) => `<span class="masked">${"_".repeat(w.length)}</span> `).join("");
  html(`<div class="bar"><i id="p"></i></div><div id="text">${spans}</div><p class="mute">Press the space bar to begin.</p>`);
  const el = [...document.querySelectorAll("#text span")];
  let k = -1, t0 = null; const rts = [];
  const handler = (e) => {
    if (e.code !== "Space") return; e.preventDefault();
    const now = performance.now();
    if (k >= 0) { rts.push(Math.round(now - t0)); el[k].textContent = "_".repeat(words[k].length); el[k].className = "masked"; }
    k++;
    if (k >= words.length) { document.removeEventListener("keydown", handler); return ask(); }
    el[k].textContent = words[k]; el[k].className = ""; t0 = now;
    document.getElementById("p").style.width = Math.round(100 * (k + 1) / words.length) + "%";
  };
  document.addEventListener("keydown", handler);
  function ask() {
    const answers = [];
    (function next(j) {
      if (j >= item.questions.length) { if (!practice) log.trials.push({ id: item.id, cond: item.cond, order: idx, words: words, rts, answers }); return done(); }
      const Q = item.questions[j], flip = Math.random() < .5, opts = flip ? [Q.wrong, Q.correct] : [Q.correct, Q.wrong], tq = performance.now();
      html(`<p><b>${Q.q}</b></p>` + opts.map((o, m) => `<button class="choice alt" data-m="${m}">${o}</button>`).join(""));
      document.querySelectorAll(".choice").forEach((b) => b.onclick = () => {
        const m = +b.dataset.m; answers.push({ q: j, correct: opts[m] === Q.correct, rt: Math.round(performance.now() - tq) }); next(j + 1);
      });
    })(0);
  }
}
function finish() {
  log.finished = new Date().toISOString();
  const accs = log.trials.flatMap((t) => t.answers.map((a) => a.correct));
  log.accuracy = accs.filter(Boolean).length / Math.max(accs.length, 1);
  const out = JSON.stringify(log);
  if (CONFIG.submitUrl) fetch(CONFIG.submitUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: out }).catch(() => {});
  html(`<h1>Thank you</h1><p>You are done.${CONFIG.completionUrl ? ' <a href="' + CONFIG.completionUrl + '">Return to Prolific</a> to receive credit.' : ""}</p>
  <p class="mute">If your data was not submitted automatically, please download the file and send it to the researcher.</p>
  <p><button id="dl">Download my data</button></p>`);
  document.getElementById("dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out], { type: "application/json" })); a.download = `spr_${PID}.json`; a.click(); };
  window.__RESULT__ = log;
}
consent();
</script>
